name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "public/**"
      - "prisma/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - "next.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "tsconfig.json"
      - ".github/workflows/docker-publish.yml"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Tag builds must come from a complete release commit: package.json,
  # latest.json, changelog.json (admin Updates changelog), and CHANGELOG.md
  # all bumped together. Publishing is gated on this, so an incomplete
  # release never ships an image.
  verify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files match the tag
        run: ./scripts/verify-release.sh "${GITHUB_REF_NAME}"

  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-amd64-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runner
          cache-from: type=gha,scope=buildkit-amd64
          cache-to: type=gha,scope=buildkit-amd64,mode=max

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-arm64-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runner
          cache-from: type=gha,scope=buildkit-arm64
          cache-to: type=gha,scope=buildkit-arm64,mode=max

  publish:
    needs: [build-amd64, build-arm64, verify-release]
    if: always() && needs.build-amd64.result == 'success' && (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped') && (needs.verify-release.result == 'success' || needs.verify-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # `:latest` must only move when a release tag is published —
            # self-host installs pull it. A main-push build carrying `:latest`
            # races the release pipeline: updaters that pull between the main
            # build and the tag build get unreleased code with a stale
            # version stamp. Main builds get `:main` instead.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable={{is_default_branch}}
            # CalVer tags (vYYYY.MICRO, and the older vYYYY.MM.DD[.N])
            # are not valid semver, so the semver types never matched and
            # no versioned image was ever published — latest.json pointed
            # at tags that didn't exist.
            # ref/event=tag publishes the git tag name verbatim.
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-arch manifest
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          SOURCES="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-amd64-${{ github.sha }}"
          if [ "${{ needs.build-arm64.result }}" = "success" ]; then
            SOURCES="$SOURCES ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-arm64-${{ github.sha }}"
          fi
          for TAG in $TAGS; do
            docker buildx imagetools create -t "$TAG" $SOURCES
          done

      - name: Clean up build tags
        run: |
          TOKEN=$(echo ${{ secrets.GITHUB_TOKEN }} | base64)
          # Build tags are temporary; they'll be overwritten on next push
          echo "Intermediate build tags will be overwritten on next run"

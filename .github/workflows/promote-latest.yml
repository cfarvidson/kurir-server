name: Promote latest image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to point :latest at (with or without leading v)
        required: true
        type: string

concurrency:
  group: promote-latest
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify latest.json has been marked stable
        run: ./scripts/verify-release.sh --mode mark-stable "${{ inputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at the already-published versioned image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${VERSION}"
          TARGET="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker buildx imagetools create -t "$TARGET" "$SOURCE"
